name: WP to Flutter Cloud Build Engine

on:
  repository_dispatch:
    types: [build_app]
  workflow_dispatch:
    inputs:
      license_key:
        description: 'Build license key (required security guard)'
        required: true
        default: 'wptf_secure_build_2026'
      app_name:
        description: 'Application display name'
        required: false
        default: 'Demo App'
      site_url:
        description: 'Website URL the app wraps'
        required: false
        default: 'https://example.com'
      primary_color:
        description: 'Primary brand color (HEX)'
        required: false
        default: '#2271b1'
      build_format:
        description: 'Build format: apk | aab | both'
        required: false
        default: 'both'
      render_mode:
        description: 'Render mode: webview | native'
        required: false
        default: 'webview'
      api_base_url:
        description: 'REST API base URL for native mode (optional)'
        required: false
        default: ''
      keystore_b64:
        description: 'Base64 PKCS12 release keystore (optional | stable signature)'
        required: false
        default: ''
      keystore_pass:
        description: 'Keystore password (optional)'
        required: false
        default: ''
      key_alias:
        description: 'Key alias (optional)'
        required: false
        default: 'wptf_release'
      package_name:
        description: 'Android applicationId (optional | derived from site domain)'
        required: false
        default: ''

permissions:
  contents: write

# One build at a time keeps release publishing and README commits race-free.
concurrency:
  group: wp-to-flutter-build-factory
  cancel-in-progress: false

jobs:
  build:
    name: Compile & Publish
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ github.event.client_payload.app_name || github.event.inputs.app_name || 'Demo App' }}
      SITE_URL: ${{ github.event.client_payload.site_url || github.event.inputs.site_url || 'https://example.com' }}
      PRIMARY_COLOR: ${{ github.event.client_payload.primary_color || github.event.inputs.primary_color || '#2271b1' }}
      BUILD_FORMAT: ${{ github.event.client_payload.build_format || github.event.inputs.build_format || 'both' }}
      RENDER_MODE: ${{ github.event.client_payload.render_mode || github.event.inputs.render_mode || 'webview' }}
      API_BASE_URL: ${{ github.event.client_payload.api_base_url || github.event.inputs.api_base_url || '' }}
      KEYSTORE_B64: ${{ github.event.client_payload.keystore_b64 || github.event.inputs.keystore_b64 || '' }}
      KEYSTORE_PASS: ${{ github.event.client_payload.keystore_pass || github.event.inputs.keystore_pass || '' }}
      KEY_ALIAS: ${{ github.event.client_payload.key_alias || github.event.inputs.key_alias || 'wptf_release' }}
      PACKAGE_NAME: ${{ github.event.client_payload.package_name || github.event.inputs.package_name || '' }}
    steps:
      - name: 'Security Guard: Verify Build License'
        env:
          LICENSE_KEY: ${{ github.event.client_payload.license_key || github.event.inputs.license_key }}
        run: |
          echo "Verifying build license..."
          if [ -z "$LICENSE_KEY" ]; then
            echo "::error::SECURITY ERROR: No license key was provided (client_payload.license_key). Build request rejected."
            exit 1
          fi
          if [ "$LICENSE_KEY" != 'wptf_secure_build_2026' ]; then
            echo "::error::SECURITY ERROR: Invalid build license key. This build factory rejects unauthorized requests."
            exit 1
          fi
          echo "License verified OK."

      - name: 'Normalize Build Format'
        run: |
          FORMAT="$(printf '%s' "$BUILD_FORMAT" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          case "$FORMAT" in
            apk|aab|both) ;;
            *) echo "::error::Invalid build_format '${FORMAT}' (allowed: apk, aab, both)."; exit 1 ;;
          esac
          echo "BUILD_FORMAT=$FORMAT" >> "$GITHUB_ENV"

      - name: 'Sanitize Brand Name'
        env:
          RAW_APP_NAME: ${{ env.APP_NAME }}
        run: |
          SAFE_NAME="$(printf '%s' "$RAW_APP_NAME" | tr -d '"'"'"'<>&|\\/$`@%' | tr -d '\n' | cut -c1-60)"
          if [ -z "$SAFE_NAME" ]; then
            SAFE_NAME="Demo App"
          fi
          echo "APP_NAME=$SAFE_NAME" >> "$GITHUB_ENV"

      - name: 'Derive Android Package Name (per-site, Java-safe)'
        env:
          RAW_PACKAGE: ${{ env.PACKAGE_NAME }}
        run: |
          SAFE="$(printf '%s' "$RAW_PACKAGE" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if ! printf '%s' "$SAFE" | grep -Eq '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'; then
            echo "::warning::Invalid or missing package_name '${SAFE}' | falling back to com.wptoflutter.wp_flutter_app."
            SAFE="com.wptoflutter.wp_flutter_app"
          fi
          echo "PACKAGE_NAME=$SAFE" >> "$GITHUB_ENV"

      - name: 'Checkout Source'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 'Setup Java 17 (Temurin)'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 'Setup Flutter (stable channel)'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 'Inject Dynamic Payload into assets/config.json'
        run: |
          jq -n \
            --arg app_name "$APP_NAME" \
            --arg site_url "$SITE_URL" \
            --arg primary_color "$PRIMARY_COLOR" \
            --arg render_mode "$RENDER_MODE" \
            --arg api_base_url "$API_BASE_URL" \
            '{app_name: $app_name, site_url: $site_url, primary_color: $primary_color, render_mode: $render_mode, api_base_url: $api_base_url}' \
            > assets/config.json
          echo "--- assets/config.json ---"
          cat assets/config.json

      - name: 'Generate Android Scaffolding (flutter create)'
        run: flutter create --platforms=android --org com.wptoflutter .

      - name: 'Patch Android Manifest (INTERNET + cleartext + hw accel + brand label)'
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            perl -0pi -e 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' "$MANIFEST"
          fi
          if ! grep -q 'usesCleartextTraffic' "$MANIFEST"; then
            perl -0pi -e 's/<application/<application\n        android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi
          if ! grep -q 'hardwareAccelerated' "$MANIFEST"; then
            perl -0pi -e 's/<application/<application\n        android:hardwareAccelerated="true"/' "$MANIFEST"
          fi
          perl -0pi -e "s/android:label=\"[^\"]*\"/android:label=\"\Q$ENV{APP_NAME}\E\"/" "$MANIFEST"
          echo "--- AndroidManifest.xml (head) ---"
          head -n 20 "$MANIFEST"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "::error::INTERNET permission injection failed."
            exit 1
          fi

      - name: 'Patch Application ID (per-site package name)'
        run: |
          GRADLE_FILE="android/app/build.gradle.kts"
          perl -0pi -e "s/applicationId = \"[^\"]*\"/applicationId = \"\Q$ENV{PACKAGE_NAME}\E\"/" "$GRADLE_FILE"
          if ! grep -q "applicationId = \"${PACKAGE_NAME}\"" "$GRADLE_FILE"; then
            echo "::error::applicationId patch to ${PACKAGE_NAME} failed."
            exit 1
          fi
          echo "applicationId patched to ${PACKAGE_NAME} (namespace untouched | code package stays valid)."

      - name: 'Flutter Pub Get'
        run: flutter pub get

      - name: 'Prepare Stable Release Keystore (PKCS12 from WordPress)'
        env:
          RAW_B64: ${{ env.KEYSTORE_B64 }}
          RAW_PASS: ${{ env.KEYSTORE_PASS }}
          RAW_ALIAS: ${{ env.KEY_ALIAS }}
        run: |
          if [ -n "$RAW_B64" ]; then
            echo "::add-mask::$RAW_B64"
            echo "::add-mask::$RAW_PASS"
            echo "::add-mask::$RAW_ALIAS"
            printf '%s' "$RAW_B64" | base64 -d > android/app/keystore.p12
            echo "Stable keystore received from WordPress | signature consistent across all builds."
          else
            echo "::warning::No keystore in payload | this build uses an EPHEMERAL signature and cannot update previous versions."
          fi

      - name: 'Patch Gradle Release Signing (PKCS12)'
        if: env.KEYSTORE_B64 != ''
        run: |
          GRADLE_FILE="android/app/build.gradle.kts"
          perl -0pi -e 's/signingConfig = signingConfigs\.getByName\("debug"\)/signingConfig = signingConfigs.getByName("release")/' "$GRADLE_FILE"
          if ! grep -q 'signingConfigs {' "$GRADLE_FILE"; then
            perl -0pi -e 's/    buildTypes \{/    signingConfigs {\n        create("release") {\n            storeType = "PKCS12"\n            storeFile = file("keystore.p12")\n            storePassword = System.getenv("KEYSTORE_PASS")\n            keyAlias = System.getenv("KEY_ALIAS")\n            keyPassword = System.getenv("KEYSTORE_PASS")\n        }\n    }\n\n    buildTypes {/' "$GRADLE_FILE"
          fi
          if ! grep -q 'keystore.p12' "$GRADLE_FILE"; then
            echo "::error::Gradle signing patch failed."
            exit 1
          fi
          echo "Gradle release signing patched OK | reads KEYSTORE_PASS/KEY_ALIAS from environment."

      - name: 'Build Release APK'
        if: env.BUILD_FORMAT == 'apk' || env.BUILD_FORMAT == 'both'
        run: flutter build apk --release

      - name: 'Build Release AAB (App Bundle)'
        if: env.BUILD_FORMAT == 'aab' || env.BUILD_FORMAT == 'both'
        run: flutter build appbundle --release

      - name: 'Publish GitHub Release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "${{ env.APP_NAME }} Build #${{ github.run_number }}"
          body: |
            Automated cloud build **#${{ github.run_number }}**
            - **App:** ${{ env.APP_NAME }}
            - **Website:** ${{ env.SITE_URL }}
            - **Primary color:** ${{ env.PRIMARY_COLOR }}
            - **Format:** ${{ env.BUILD_FORMAT }}
            - **Triggered by:** WP to Flutter WordPress plugin
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          fail_on_unmatched_files: false
          make_latest: true

      - name: 'Showcase Updater: append row to README.md'
        run: |
          BUILD_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/build-${{ github.run_number }}"
          APK_CELL="[Download APK](${BASE_URL}/app-release.apk)"
          AAB_CELL="[Download AAB](${BASE_URL}/app-release.aab)"
          if [ "$BUILD_FORMAT" = "apk" ]; then AAB_CELL="—"; fi
          if [ "$BUILD_FORMAT" = "aab" ]; then APK_CELL="—"; fi
          printf '| %s | %s | %s | %s |\n' "$APP_NAME" "$BUILD_DATE" "$APK_CELL" "$AAB_CELL" >> README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes to commit."
          else
            git commit -m "chore(showcase): add ${APP_NAME} (build #${{ github.run_number }})"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
