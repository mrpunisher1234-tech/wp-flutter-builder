name: wp_flutter_app
description: >-
  WebView application compiled by the WP to Flutter Cloud Build Engine
  (wp-flutter-builder). Brand values are injected into assets/config.json
  at build time by the GitHub Actions pipeline.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.7.0
  webview_flutter_android: ^4.12.0
  flutter_spinkit: ^5.2.0
  http: ^1.6.0
  url_launcher: ^6.3.0
  app_links: ^6.4.0
  flutter_widget_from_html_core: ^0.17.4
  shared_preferences: ^2.5.5
  # درگاه پرداخت درون‌برنامه‌ای کافه‌بازار | فقط روی اندروید کار می‌کند.
  flutter_poolakey: ^2.2.0+1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # کل پوشه assets بستهبندی میشود تا بیلد ابری بتواند لوگوی اسپلش را
  # به صورت assets/splash_logo.png کنار config.json تزریق کند (لود در فریم اول).
  assets:
    - assets/
  # فونت وزیرمتن | خانوادهٔ پیشفرض کل اپ (متن فارسی + ارقام فارسی/لاتین).
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Thin.ttf
          weight: 100
        - asset: assets/fonts/Vazirmatn-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Vazirmatn-Light.ttf
          weight: 300
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Vazirmatn-Black.ttf
          weight: 900
