name: wp_flutter_app
description: >-
  WebView application compiled by the WP to Flutter Cloud Build Engine
  (wp-flutter-builder). Brand values are injected into assets/config.json
  at build time by the GitHub Actions pipeline.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <5.0.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.7.0
  webview_flutter_android: ^4.12.0
  flutter_spinkit: ^5.2.0
  http: ^1.6.0
  flutter_widget_from_html_core: ^0.17.4
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/config.json
